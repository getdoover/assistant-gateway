[project]
name = "assistant-gateway"
version = "0.1.0"
description = "Run arbitrary sh commands on the device host over RPC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.14.0",
]

[project.scripts]
doover-app-run = "assistant_gateway:main"
export-config = "assistant_gateway.app_config:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "requests>=2.32.3",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
